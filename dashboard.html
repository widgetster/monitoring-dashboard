<!DOCTYPE html>

<html>
  <head>
    <title>Factory Dashboard</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/general.css">
    <link rel="stylesheet" href="./styles/dashboard.css">


    <body>
      FACTORY DASHBOARD

      <div class="dashboard-cont">
        <div>
          Running          
          <div class="dashboard-data">3</div>
        </div>

        <div>
          Warning
          <div class="dashboard-data">4</div>
        </div>

        <div>
          Stopped
          <div class="dashboard-data">2</div>
        </div>
      </div>

      
      <div>        
        Machines

        <div class="dashboard-cont">
          <div>
            ID          
            <div class="dashboard-data">1</div>
          </div>

          <div>
            Name
            <div class="dashboard-data">Robot 1</div>
          </div>

          <div>
            Status
            <div class="dashboard-data">Running</div>
          </div>

          <div>
            Temerature
            <div class="dashboard-data">36</div>
          </div>
        </div>
        
      </div>


      <button>Start Simulation</button>
      <button>Stop Simulation</button>
      


      <script type="module" src="dashboard.js"></script>
    </body>
  </head>
</html>
