<!DOCTYPE html>

<html>
  <head>
    <title>Factory Dashboard</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/general.css">
    <link rel="stylesheet" href="./styles/dashboard.css">


    <body>
      FACTORY DASHBOARD

      <div class="dashboard-cont">
        <div>
          Running          
          <div class="dashboard-data js-running-count">0</div>
        </div>

        <div>
          Warning
          <div class="dashboard-data js-warning-count">0</div>
        </div>

        <div>
          Stopped
          <div class="dashboard-data js-stopped-count">0</div>
        </div>
      </div>


      <button class="js-start-stop-button"><span class="js-start-stop-span">Start</span> Simulation</button> 

      
      <div class="robot-container">        
        Robots

        <div class="dashboard-cont js-robots-summary">
          <div>
            ID          
            <div class="dashboard-data js-robots-id">

            </div>

          </div>

          <div>
            Name
            <div class="dashboard-data js-robots-name">
              
            </div>
          </div>

          <div>
            Status
            <div class="dashboard-data js-robots-status">
              
            </div>
          </div>

          <div>
            Temerature
            <div class="dashboard-data js-robots-temperature">
              
            </div>
          </div>
        </div>

        
      </div>


           


      <script type="module" src="scripts/dashboard.js"></script>
    </body>
  </head>
</html>
